<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">HiLegal</title>
    <link rel="stylesheet" href="./css/Reset.css">
    <link rel="stylesheet" href="./css/Normalize.css">
    <link rel="stylesheet" href="./dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/Styles.css">
</head>

<body>

    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="./index.html">
                    <img src="./Images/Logo.svg" alt="Hlegal Logo" class="header__logo-img">
                </a>
                <img src="./Images/Slash.svg" alt="Slash" class="header__slash">
                <span class="header__current-menu" data-i18n="menu.about"></span>
            </div>

            <div class="header__right">
                <div class="header__top-info">
                    <div class="header__langs">
                        <button class="header__lang-btn" data-lang="ua">UA</button>
                        <button class="header__lang-btn" data-lang="ru">RU</button>
                        <button class="header__lang-btn header__lang-btn--active" data-lang="en">EN</button>
                    </div>

                    <span class="header__top-separator"></span>
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" target="_blank" class="header__top-item"
                        data-i18n="header.address"></a>
                    <span class="header__top-separator"></span>
                    <a href="tel:0800211927" class="header__top-item">0800 211 927</a>
                    <span class="header__top-separator"></span>
                    <a href="https://www.facebook.com/?locale=ru_RU" class="header__top-social">
                        <img src="./Images/LogoFBGray.png" alt="Facebook">
                    </a>
                </div>
                <button class="header__burger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="header__nav">
                    <ul class="header__menu">
                        <li class="header__item"><a href="./about-us.html" class="header__link header__link--active"
                                data-i18n="menu.about"></a></li>
                        <li class="header__item"><a href="./services-page.html" class="header__link"
                                data-i18n="menu.services"></a></li>
                        <li class="header__item"><a href="./team.html" class="header__link" data-i18n="menu.team"></a>
                        </li>
                        <li class="header__item"><a href="./publications-page.html" class="header__link"
                                data-i18n="menu.publications"></a></li>
                        <li class="header__item"><a href="./contact.html" class="header__link"
                                data-i18n="menu.contact"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="about">
        <section class="about__intro container">
            <div class="about__intro-left">
                <h1 class="about__title gradient-text" data-i18n="about.title"></h1>
                <p class="about__text" data-i18n="about.text"></p>
            </div>
            <div class="about__intro-right">
                <div class="about__line"></div>
                <div class="about__stats">
                    <div class="about__stat">
                        <img src="./Images/IconExp.svg" alt="" class="about__icon">
                        <div>
                            <h2 class="about__number gradient-text" data-i18n="about.stats.experience"></h2>
                            <span class="about__label" data-i18n="about.stats.experienceLabel"></span>
                        </div>
                    </div>
                    <div class="about__stat">
                        <img src="./Images/IconClients.svg" alt="" class="about__icon">
                        <div>
                            <h2 class="about__number gradient-text" data-i18n="about.stats.clients"></h2>
                            <span class="about__label" data-i18n="about.stats.clientsLabel"></span>
                        </div>
                    </div>
                    <div class="about__stat">
                        <img src="./Images/IconProBono.svg" alt="" class="about__icon">
                        <div>
                            <h2 class="about__number gradient-text" data-i18n="about.stats.proBono"></h2>
                            <span class="about__label" data-i18n="about.stats.proBonoLabel"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="about__team">
            <img src="./Images/TeamPhoto.webp" loading="lazy" alt="Team" class="about__team-img">
            <div class="about__team-overlay">
                <h2 class="about__team-title" data-i18n="about.team"></h2>
            </div>
        </section>

        <section class="quality__intro container">
            <div class="quality__intro-left">
                <p class="quality__text" data-i18n="quality.text"></p>
            </div>
            <div class="quality__intro-right">
                <h2 class="quality__title gradient-text" data-i18n="quality.title"></h2>
            </div>
        </section>
    </main>

    <footer class="footer">
        <section class="footer__achievements">
            <h3 class="footer__title" data-i18n="footer.achievements"></h3>
            <div class="footer__images">
                <img src="./Images/Image1.webp" alt="Achievement 1" class="footer__image">
                <img src="./Images/Image2.webp" alt="Achievement 2" class="footer__image">
                <img src="./Images/Image3.webp" alt="Achievement 3" class="footer__image">
                <img src="./Images/Image4.webp" alt="Achievement 4" class="footer__image">
            </div>
            <div class="footer__pagination">
                <span class="footer__dot footer__dot--active"></span>
                <span class="footer__dot"></span>
                <span class="footer__dot"></span>
            </div>
        </section>

        <div class="footer__bottom">
            <div class="footer__left">
                <div class="footer__address-block">
                    <p class="footer__address" data-i18n="footer.address"></p>
                    <span class="header__top-separator"></span>
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" target="_blank" class="footer__map"
                        data-i18n="footer.map"></a>
                </div>
                <div class="footer__contacts">
                    <a href="https://www.facebook.com/?locale=ru_RU" class="footer__social"><img
                            src="./Images/LogoFB.png" alt="Facebook"></a>
                    <span class="header__top-separator"></span>
                    <a href="tel:0800211927" class="footer__phone">0800 211 927</a>
                    <span class="header__top-separator"></span>
                    <a href="mailto:contact@hlegal.com" class="footer__email">contact@hlegal.com</a>
                </div>
            </div>

            <p class="footer__copyright">© 2026 HLEGAL Law company, LLC</p>
        </div>
    </footer>
    <script src="https://unpkg.com/i18next@22.4.9/i18next.min.js"></script>
    <script src="./js/i18n-about-us.js"></script>
    <script src="./dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/scripts.js"></script>
</body>

</html>
