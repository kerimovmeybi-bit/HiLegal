<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiLegal Team</title>
    <link rel="stylesheet" href="./css/Reset.css">
    <link rel="stylesheet" href="./css/Normalize.css">
    <link rel="stylesheet" href="./dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/team-entry-page.css">
</head>

<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="./index.html">
                    <img src="./Images/Logo.svg" alt="Hlegal Logo" class="header__logo-img">
                </a>
                <img src="./Images/Slash.svg" alt="Slash" class="header__slash">
                <span class="header__current-menu" data-i18n="team.menu"></span>
            </div>
            <div class="header__right">
                <div class="header__top-info">
                    <div class="header__langs">
                        <button class="header__lang-btn">UA</button>
                        <button class="header__lang-btn">RU</button>
                        <button class="header__lang-btn header__lang-btn--active">EN</button>
                    </div>
                    <span class="header__top-separator"></span>
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" target="_blank" class="header__top-item"
                        data-i18n="team.address"></a>
                    <span class="header__top-separator"></span>
                    <a href="tel:0800211927" class="header__top-item">0800 211 927</a>
                    <span class="header__top-separator"></span>
                    <a href="https://www.facebook.com/?locale=ru_RU" class="header__top-social">
                        <img src="./Images/LogoFBGray.png" alt="Facebook">
                    </a>
                </div>
                <button class="header__burger"><span></span><span></span><span></span></button>
                <nav class="header__nav">
                    <ul class="header__menu">
                        <li class="header__item"><a href="./about-us.html" class="header__link"
                                data-i18n="team.about_us"></a></li>
                        <li class="header__item"><a href="./services-page.html" class="header__link"
                                data-i18n="team.services"></a></li>
                        <li class="header__item"><a href="./team.html" class="header__link header__link--active"
                                data-i18n="team.team"></a></li>
                        <li class="header__item"><a href="./publications-page.html" class="header__link"
                                data-i18n="team.publications"></a></li>
                        <li class="header__item"><a href="./contact.html" class="header__link"
                                data-i18n="team.contact"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <section>
            <div class="team-info">
                <img src="" alt="Team Member" class="team-info__img" data-img="">
                <div class="team-info__details">
                    <h2 class="team-info__name" data-name=""></h2>
                    <div class="team-info__contact">
                        <p class="team-info__role" data-position=""></p>
                        <span class="header__top-separator"></span>
                        <a href="#" target="_blank" class="info" data-email=""></a>
                        <span class="header__top-separator"></span>
                        <a href="#" target="_blank" class="info" data-i18n="team.linkedin"></a>
                    </div>
                    <div class="h-line"></div>
                    <p class="team-info__bio" data-text1=""></p>
                    <p class="team-info__bio" data-text2=""></p>
                    <h3 class="team-title" data-i18n="team.education_title"></h3>
                    <p class="team-info__bio" data-text3=""></p>
                    <h3 class="team-title" data-i18n="team.experience_title"></h3>
                    <p class="team-info__bio" data-text4=""></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer__bottom">
            <div class="footer__left">
                <div class="footer__address-block">
                    <p class="footer__address" data-i18n="team.address"></p>
                    <span class="header__top-separator"></span>
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" class="footer__map" data-i18n="team.on_map"></a>
                </div>
                <div class="footer__contacts">
                    <a href="#" class="footer__social"><img src="./Images/LogoFB.png" alt="Facebook"></a>
                    <span class="header__top-separator"></span>
                    <a href="tel:0800211927" class="footer__phone">0800 211 927</a>
                    <span class="header__top-separator"></span>
                    <a href="mailto:contact@hlegal.com" class="footer__email">contact@hlegal.com</a>
                </div>
            </div>
            <p class="footer__copyright">© 2026 HLEGAL Law company, LLC</p>
        </div>
    </footer>

    <script src="https://unpkg.com/i18next@23.4.6/dist/umd/i18next.min.js"></script>
    <script src="./dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/scripts.js"></script>
    <script src="./js/i18n-team-entry-page.js"></script>
</body>

</html>
