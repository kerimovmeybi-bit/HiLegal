<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">HiLegal</title>
    <link rel="stylesheet" href="./css/Reset.css">
    <link rel="stylesheet" href="./css/Normalize.css">
    <link rel="stylesheet" href="./dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/contact.css">
</head>

<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo">
                <a href="./index.html">
                    <img src="./Images/Logo.svg" alt="Hlegal Logo" class="header__logo-img">
                </a>
                <img src="./Images/Slash.svg" alt="Slash" class="header__slash">
                <span class="header__current-menu" data-i18n="menu.contact"></span>
            </div>

            <div class="header__right">
                <div class="header__top-info">
                    <div class="header__langs">
                        <button class="header__lang-btn" data-lang="ua">UA</button>
                        <button class="header__lang-btn" data-lang="ru">RU</button>
                        <button class="header__lang-btn header__lang-btn--active" data-lang="en">EN</button>
                    </div>

                    <span class="header__top-separator"></span>
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" target="_blank" class="header__top-item"
                        data-i18n="header.address"></a>
                    <span class="header__top-separator"></span>
                    <a href="tel:0800211927" class="header__top-item">0800 211 927</a>
                    <span class="header__top-separator"></span>
                    <a href="https://www.facebook.com/?locale=ru_RU" class="header__top-social">
                        <img src="./Images/LogoFBGray.png" alt="Facebook">
                    </a>
                </div>
                <button class="header__burger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <nav class="header__nav">
                    <ul class="header__menu">
                        <li class="header__item"><a href="./about-us.html" class="header__link"
                                data-i18n="menu.about"></a></li>
                        <li class="header__item"><a href="./services-page.html" class="header__link"
                                data-i18n="menu.services">s</a></li>
                        <li class="header__item"><a href="./team.html" class="header__link" data-i18n="menu.team"></a>
                        </li>
                        <li class="header__item"><a href="./publications-page.html" class="header__link"
                                data-i18n="menu.publications"></a></li>
                        <li class="header__item"><a href="./contact.html" class="header__link header__link--active"
                                data-i18n="menu.contact"></a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>
    <main class="main">
        <section>
            <div class="contact">
                <div class="contact__menu">
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" target="_blank" class="contact__text"
                        data-i18n="contact.address"></a>
                    <div class="h-line"></div>
                    <a href="tel:0800211927" class="contact__text">0800 211 927<br></a>
                    <a href="#" target="_blank" class="email">contact@forstudy.space</a>
                    <div class="h-line"></div>
                    <a href="https://www.facebook.com/?locale=ru_RU" target="_blank" class="facebook">
                        <img src="./Images/Facebook.svg" alt="icon" class="icon-facebook">
                        <p class="icon-text" data-i18n="contact.facebook"></p>
                    </a>
                </div>
                <form class="feedback" id="feedbackForm">
                    <p class="feedback__text" data-i18n="contact.feedback.intro"></p>
                    <input type="text" class="feedback__input" name="name" data-i18n-placeholder="contact.feedback.name"
                        placeholder="Name" required>
                    <textarea class="feedback__input feedback__textarea" name="message"
                        data-i18n-placeholder="contact.feedback.message" placeholder="Message" required></textarea>
                    <p class="feedback__text__1" data-i18n="contact.feedback.question"></p>
                    <input type="tel" class="feedback__input" name="phone"
                        data-i18n-placeholder="contact.feedback.phone" placeholder="Phone number">
                    <input type="email" class="feedback__input" name="email"
                        data-i18n-placeholder="contact.feedback.email" placeholder="Email" required>
                    <button type="submit" class="feedback__button" data-i18n="contact.feedback.send"></button>
                </form>
            </div>
        </section>
    </main>
    <footer class="footer">
        <section class="footer__achievements">
            <h3 class="footer__title" data-i18n="footer.achievements"></h3>
            <div class="footer__images">
                <img src="./Images/Image1.webp" alt="Achievement 1" class="footer__image">
                <img src="./Images/Image2.webp" alt="Achievement 2" class="footer__image">
                <img src="./Images/Image3.webp" alt="Achievement 3" class="footer__image">
                <img src="./Images/Image4.webp" alt="Achievement 4" class="footer__image">
            </div>
            <div class="footer__pagination">
                <span class="footer__dot footer__dot--active"></span>
                <span class="footer__dot"></span>
                <span class="footer__dot"></span>
            </div>
        </section>

        <div class="footer__bottom">
            <div class="footer__left">
                <div class="footer__address-block">
                    <p class="footer__address" data-i18n="footer.address"></p>
                    <span class="header__top-separator"></span>
                    <a href="https://maps.app.goo.gl/L47bBTYmAznCxuok6" class="footer__map" data-i18n="footer.map"></a>
                </div>
                <div class="footer__contacts">
                    <a href="#" class="footer__social"><img src="./Images/LogoFB.png" alt="Facebook"></a>
                    <span class="header__top-separator"></span>
                    <a href="tel:0800211927" class="footer__phone">0800 211 927</a>
                    <span class="header__top-separator"></span>
                    <a href="mailto:contact@hlegal.com" class="footer__email">contact@hlegal.com</a>
                </div>
            </div>

            <p class="footer__copyright">© 2026 HLEGAL Law company, LLC</p>
        </div>
    </footer>
    <script src="./dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/i18next@22.4.9/i18next.min.js"></script>
    <script src="./js/scripts.js"></script>
    <script src="./js/i18n-contact.js"></script>
</body>

</html>
